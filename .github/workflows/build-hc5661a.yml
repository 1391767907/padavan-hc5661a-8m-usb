name: Build HC5661A Padavan (8M+64M USB)

on:
  workflow_dispatch:

env:
  SOURCE_REPO: https://github.com/hanwckf/rt-n56u.git
  TOOLCHAIN_URL: https://github.com/hanwckf/padavan-toolchain/releases/download/v1.1/mipsel-linux-uclibc.tar.xz
  PRODUCT: HC5661A
  BUILD_DIR: /opt/rt-n56u

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake bison flex gawk gettext \
            git gperf libtool pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev texinfo unzip libncurses5-dev \
            ccache gengetopt python3 wget cpio fakeroot xz-utils \
            libtool-bin python3-docutils autopoint

      - name: Clone Padavan source
        run: |
          sudo mkdir -p "$BUILD_DIR" /opt/images
          sudo chown -R "$USER:$USER" /opt/rt-n56u /opt/images
          git clone --depth=1 "$SOURCE_REPO" "$BUILD_DIR"
          echo "source=$(git -C "$BUILD_DIR" rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup toolchain
        run: |
          mkdir -p "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x"
          wget -qO /tmp/mipsel-linux-uclibc.tar.xz "$TOOLCHAIN_URL"
          tar -C "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x" -xf /tmp/mipsel-linux-uclibc.tar.xz
          # archive may contain a top-level dir; flatten if needed
          if [ ! -x "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc" ]; then
            inner=$(find "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x" -type f -name 'mipsel-linux-uclibc-gcc' | head -n1)
            if [ -n "$inner" ]; then
              indir=$(dirname "$(dirname "$inner")")
              shopt -s dotglob
              mv "$indir"/* "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x/" || true
            fi
          fi
          "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc" --version | head -1
          ls -la "$BUILD_DIR/toolchain-mipsel/toolchain-3.4.x/bin" | head

      - name: Apply HC5661A overlay
        run: |
          sed -i 's/\r$//' overlay/scripts/prepare.sh
          bash overlay/scripts/prepare.sh "$BUILD_DIR"

      - name: Build firmware
        working-directory: /opt/rt-n56u/trunk
        run: |
          set -e
          # prefer CI helper if present
          if [ -x ./build_firmware_ci ]; then
            fakeroot ./build_firmware_ci "${PRODUCT}"
          else
            cp -f "configs/templates/${PRODUCT}.config" .config
            fakeroot ./build_firmware "${PRODUCT}"
          fi
          echo "## Build result" >> "$GITHUB_STEP_SUMMARY"
          ls -lah images/ >> "$GITHUB_STEP_SUMMARY"
          test -n "$(ls images/*.trx 2>/dev/null || true)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -f /opt/rt-n56u/trunk/images/*.trx out/ || true
          cp -f /opt/rt-n56u/trunk/images/* out/ || true
          ls -lah out/
          test -n "$(ls -A out)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: padavan-HC5661A-8M-USB
          path: out/
          if-no-files-found: error
          retention-days: 30
